<div class="app-container" [class.with-sidebar]="showGlobalSidebar">
  <!-- 🍔 Mobile/Floating Menu Trigger -->
  <button class="sidebar-trigger" *ngIf="showGlobalSidebar" (click)="toggleSidebar()" title="Menu">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- 🔙 Back Button -->
  <button class="back-trigger" *ngIf="showBackButton()" (click)="goBack()" title="Back">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <app-sidebar *ngIf="showGlobalSidebar"></app-sidebar>
  <main class="app-main-content">
    <router-outlet></router-outlet>
  </main>
</div>
